# Shared proxy settings for Jarvis (included by the site config)
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;

# Stream uploads straight to Rails instead of spooling them to nginx's disk first
proxy_request_buffering off;
# Never write responses (e.g. decrypted documents) to nginx temp files on disk
proxy_max_temp_file_size 0;

proxy_connect_timeout 10s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

version: 2
updates:
- package-ecosystem: bundler
  directory: "/backend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]
- package-ecosystem: bun
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
